services:
  crm:
    build: .
    image: casa-ludic-crm:latest
    container_name: casa-ludic-crm
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./outputs:/app/outputs
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os; sqlite3.connect('/app/outputs/leads.db').close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
